name = "machi-koro-2-online"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Set to your GitHub Pages origin before deploying, e.g. "https://<user>.github.io"
ALLOWED_ORIGINS = "https://mropoom-tech.github.io"

# Card art (gitignored, built by `node tools/build-card-assets.mjs`). run_worker_first makes every
# request go through the Worker, which only serves images to players holding a signed room ticket.
[assets]
directory = "./card-assets"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the ones available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

name = "machi-koro-2-online"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Set to your GitHub Pages origin before deploying, e.g. "https://<user>.github.io"
ALLOWED_ORIGINS = "https://mropoom-tech.github.io"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the ones available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
